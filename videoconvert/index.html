<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Converter Resize 50%</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.header{background:#111827;color:#fff;text-align:center;padding:22px 15px}
.header h1{margin:0;font-size:24px}.header p{margin:7px 0 0;color:#d1d5db}
.container{width:92%;max-width:650px;margin:30px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.upload-title{font-size:20px;font-weight:bold;margin-bottom:15px}
.upload-box{border:2px dashed #9ca3af;border-radius:14px;padding:35px 20px;text-align:center;background:#f9fafb}
.upload-icon{font-size:45px}.upload-box p{color:#6b7280}.file-input{width:100%;margin-top:15px}
video{width:100%;max-height:350px;margin-top:20px;background:#000;border-radius:12px}
.info{margin-top:18px;padding:15px;background:#f3f4f6;border-radius:10px;line-height:1.7;font-size:14px}
.action-button{display:block;width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.action-button:hover{background:#1d4ed8}.action-button:disabled{background:#9ca3af;cursor:not-allowed}
#downloadButton{display:none}progress{width:100%;height:20px;margin-top:20px}
#status{text-align:center;margin-top:12px;font-weight:bold}
.error-box{display:none;margin-top:15px;padding:12px;background:#fee2e2;color:#991b1b;border-radius:10px;font-size:13px;word-break:break-word}
.footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}
</style>
</head>
<body>
<header class="header">
<h1>🎬 Video Converter Resize 50%</h1>
<p>MP4 / WebM → MP4 • Resolusi turun 50%</p>
</header>

<div class="container">
<div class="upload-title">📱 Upload Video HPFA</div>
<div class="upload-box">
<div class="upload-icon">🎥</div>
<strong>Pilih Video dari HP</strong>
<p>MP4 atau WebM</p>
<input class="file-input" type="file" id="videoInput" accept="video/*">
</div>

<video id="videoPreview" controls style="display:none"></video>
<div id="videoInfo" class="info" style="display:none"></div>

<button id="resizeButton" class="action-button" disabled>🔽 Resize Turun 50%</button>
<progress id="progressBar" value="0" max="100" style="display:none"></progress>
<div id="status"></div>
<div id="errorBox" class="error-box"></div>

<a id="downloadButton" class="action-button" href="#" download="video-resize-50.mp4">⬇️ Download Video Hasil</a>
</div>
<div class="footer">Video Converter • Resize 50%</div>

<script src="ffmpeg/ffmpeg.js"></script>
<script>
const videoInput=document.getElementById("videoInput");
const videoPreview=document.getElementById("videoPreview");
const videoInfo=document.getElementById("videoInfo");
const resizeButton=document.getElementById("resizeButton");
const progressBar=document.getElementById("progressBar");
const status=document.getElementById("status");
const errorBox=document.getElementById("errorBox");
const downloadButton=document.getElementById("downloadButton");

let selectedFile=null, outputURL=null, ffmpeg=null, ffmpegLoaded=false;

function esc(s){
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

videoInput.addEventListener("change",function(){
 const file=this.files[0]; if(!file)return;
 selectedFile=file;
 videoPreview.src=URL.createObjectURL(file);
 videoPreview.style.display="block";
 videoPreview.onloadedmetadata=function(){
  const w=videoPreview.videoWidth,h=videoPreview.videoHeight;
  videoInfo.style.display="block";
  videoInfo.innerHTML=`<b>Nama File:</b> ${esc(file.name)}<br>
  <b>Ukuran:</b> ${(file.size/1024/1024).toFixed(2)} MB<br>
  <b>Resolusi Asli:</b> ${w} × ${h}<br>
  <b>Resolusi Hasil:</b> ${Math.floor(w/2)} × ${Math.floor(h/2)}<br>
  <b>Input:</b> ${esc(file.type||"video")}<br><b>Output:</b> MP4`;
 };
 resizeButton.disabled=false;
 downloadButton.style.display="none";
 progressBar.style.display="none";
 errorBox.style.display="none";
 status.textContent="";
});

async function loadFFmpeg(){
 if(ffmpegLoaded)return;
 if(typeof FFmpegWASM==="undefined" || !FFmpegWASM.FFmpeg){
  throw new Error("ffmpeg.js tidak berhasil dimuat. Pastikan folder /ffmpeg/ sudah ter-upload.");
 }
 status.textContent="⏳ Menyiapkan converter...";
 const {FFmpeg}=FFmpegWASM;
 ffmpeg=new FFmpeg();
 ffmpeg.on("log",({message})=>console.log("FFmpeg:",message));
 ffmpeg.on("progress",({progress})=>{
  if(progress>=0&&progress<=1){
   progressBar.value=progress*100;
   status.textContent="⏳ Memproses "+Math.round(progress*100)+"%";
  }
 });
 const base="ffmpeg/ffmpeg-core.js";
 const wasm="ffmpeg/ffmpeg-core.wasm";
 await ffmpeg.load({coreURL:base,wasmURL:wasm});
 ffmpegLoaded=true;
}

resizeButton.addEventListener("click",async function(){
 if(!selectedFile)return;
 resizeButton.disabled=true; downloadButton.style.display="none";
 errorBox.style.display="none"; progressBar.style.display="block"; progressBar.value=0;
 try{
  await loadFFmpeg();
  status.textContent="⏳ Membaca video...";
  let ext=(selectedFile.name.split(".").pop()||"mp4").toLowerCase();
  if(!/^[a-z0-9]+$/.test(ext))ext="mp4";
  const inputName="input."+ext;
  await ffmpeg.writeFile(inputName,new Uint8Array(await selectedFile.arrayBuffer()));
  status.textContent="⏳ Resize video 50%...";
  await ffmpeg.exec([
   "-i",inputName,
   "-vf","scale=trunc(iw/2/2)*2:trunc(ih/2/2)*2",
   "-c:v","libx264","-preset","ultrafast","-crf","23",
   "-c:a","aac","-b:a","128k","-movflags","+faststart",
   "output.mp4"
  ]);
  const data=await ffmpeg.readFile("output.mp4");
  const blob=new Blob([data.buffer],{type:"video/mp4"});
  if(outputURL)URL.revokeObjectURL(outputURL);
  outputURL=URL.createObjectURL(blob);
  downloadButton.href=outputURL;
  downloadButton.download="video-resize-50.mp4";
  downloadButton.style.display="block";
  progressBar.value=100;
  status.textContent="✅ Selesai! MP4 siap di-download.";
  try{await ffmpeg.deleteFile(inputName);await ffmpeg.deleteFile("output.mp4")}catch(e){}
 }catch(err){
  console.error(err);
  status.textContent="❌ Gagal memproses video.";
  errorBox.style.display="block";
  errorBox.innerHTML="<b>Error:</b><br>"+esc(err.message||String(err));
 }
 resizeButton.disabled=false;
});
</script>
</body>
</html>
