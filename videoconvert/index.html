<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Converter Resize 50%</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.header{background:#111827;color:#fff;text-align:center;padding:22px 15px}
.header h1{margin:0;font-size:24px}
.header p{margin:7px 0 0;color:#d1d5db}
.container{width:92%;max-width:650px;margin:30px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.upload-title{font-size:20px;font-weight:bold;margin-bottom:15px}
.upload-box{border:2px dashed #9ca3af;border-radius:14px;padding:35px 20px;text-align:center;background:#f9fafb}
.upload-icon{font-size:45px}.upload-box p{color:#6b7280}
.file-input{width:100%;margin-top:15px}
video{width:100%;max-height:350px;margin-top:20px;background:#000;border-radius:12px}
.info{margin-top:18px;padding:15px;background:#f3f4f6;border-radius:10px;line-height:1.7;font-size:14px}
.btn{display:block;width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{background:#9ca3af}
#download{display:none}
progress{width:100%;height:20px;margin-top:20px}
#status{text-align:center;margin-top:12px;font-weight:bold}
#error{display:none;margin-top:15px;padding:12px;background:#fee2e2;color:#991b1b;border-radius:10px;font-size:13px;word-break:break-word}
.footer{text-align:center;color:#6b7280;font-size:12px;padding:20px}
</style>
</head>

<body>

<header class="header">
<h1>🎬 Video Converter Resize 50%</h1>
<p>MP4 / WebM → MP4 • Resolusi turun 50%</p>
</header>

<div class="container">

<div class="upload-title">📱 Upload Video HPFA</div>

<div class="upload-box">
<div class="upload-icon">🎥</div>
<strong>Pilih Video dari HP</strong>
<p>MP4 atau WebM</p>

<input
id="file"
class="file-input"
type="file"
accept="video/*">
</div>

<video id="preview" controls style="display:none"></video>

<div id="info" class="info" style="display:none"></div>

<button id="resize" class="btn" disabled>
🔽 Resize Turun 50%
</button>

<progress id="progress" value="0" max="100" style="display:none"></progress>

<div id="status"></div>

<div id="error"></div>

<a id="download" class="btn" download="video-resize-50.mp4">
⬇️ Download Video Hasil
</a>

</div>

<div class="footer">
Video Converter • Resize 50%
</div>


<script src="./ffmpeg/ffmpeg.js"></script>

<script>

const fileInput =
document.getElementById("file");

const preview =
document.getElementById("preview");

const info =
document.getElementById("info");

const resize =
document.getElementById("resize");

const progress =
document.getElementById("progress");

const status =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const download =
document.getElementById("download");

let selectedFile = null;
let ffmpeg = null;
let loaded = false;
let outputURL = null;


/* =========================
   PILIH VIDEO
========================= */

fileInput.onchange = () => {

const file =
fileInput.files[0];

if(!file)return;

selectedFile = file;

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

preview.onloadedmetadata = () => {

const w =
preview.videoWidth;

const h =
preview.videoHeight;

info.style.display =
"block";

info.innerHTML = `
<b>Nama:</b> ${file.name}<br>
<b>Ukuran:</b> ${(file.size/1024/1024).toFixed(2)} MB<br>
<b>Resolusi:</b> ${w} × ${h}<br>
<b>Hasil:</b> ${Math.floor(w/2)} × ${Math.floor(h/2)}<br>
<b>Output:</b> MP4
`;

};

resize.disabled = false;
download.style.display = "none";
errorBox.style.display = "none";
status.textContent = "";

};


/* =========================
   LOAD FFMPEG
========================= */

async function toBlobURL(url, mimeType) {

const response = await fetch(url, {
    cache: "no-store"
});

if (!response.ok) {
    throw new Error(
        "Gagal mengambil " +
        url +
        " (HTTP " +
        response.status +
        ")"
    );
}

const blob = await response.blob();

return URL.createObjectURL(
    new Blob(
        [blob],
        { type: mimeType }
    )
);

}


async function loadFFmpeg(){

if(loaded)
return;


if(
typeof FFmpegWASM === "undefined"
){

throw new Error(
"ffmpeg.js gagal dimuat dari ./ffmpeg/ffmpeg.js"
);

}


const FFmpeg =
FFmpegWASM.FFmpeg;


ffmpeg =
new FFmpeg();


ffmpeg.on(
"log",
({message}) => {

console.log(
"FFmpeg:",
message
);

});


ffmpeg.on(
"progress",
({progress:p}) => {

if(
p >= 0 &&
p <= 1
){

progress.value =
p * 100;

status.textContent =
"⏳ Memproses " +
Math.round(p * 100) +
"%";

}

});


status.textContent =
"⏳ Mengambil FFmpeg core...";


/*
==================================================
LOCAL FILE → BLOB URL

Ini memperbaiki error:

Failed to fetch dynamically imported module
==================================================
*/

const coreURL =
await toBlobURL(
"./ffmpeg/ffmpeg-core.js?v=1",
"text/javascript"
);


const wasmURL =
await toBlobURL(
"./ffmpeg/ffmpeg-core.wasm?v=1",
"application/wasm"
);


status.textContent =
"⏳ Menjalankan FFmpeg...";


await ffmpeg.load({

coreURL:
coreURL,

wasmURL:
wasmURL

});


loaded = true;


status.textContent =
"✅ Converter siap.";

}

/* =========================
   RESIZE
========================= */

resize.onclick = async () => {

if(!selectedFile)return;

resize.disabled = true;

download.style.display = "none";

errorBox.style.display = "none";

progress.style.display = "block";

progress.value = 0;

try{

status.textContent =
"⏳ Menyiapkan converter...";

await loadFFmpeg();

status.textContent =
"⏳ Membaca video...";


let ext =
selectedFile.name
.split(".")
.pop()
.toLowerCase();


if(
!["mp4","webm","mov","mkv","avi"]
.includes(ext)
){

ext = "mp4";

}


const input =
"input." + ext;


await ffmpeg.writeFile(
input,
new Uint8Array(
await selectedFile.arrayBuffer()
)
);


status.textContent =
"⏳ Resize video 50%...";


await ffmpeg.exec([

"-i",
input,

"-vf",
"scale=trunc(iw/2/2)*2:trunc(ih/2/2)*2",

"-c:v",
"libx264",

"-preset",
"ultrafast",

"-crf",
"23",

"-c:a",
"aac",

"-b:a",
"128k",

"-movflags",
"+faststart",

"output.mp4"

]);


const data =
await ffmpeg.readFile(
"output.mp4"
);


const blob =
new Blob(
[data.buffer],
{type:"video/mp4"}
);


if(outputURL){

URL.revokeObjectURL(
outputURL
);

}


outputURL =
URL.createObjectURL(
blob
);


download.href =
outputURL;

download.download =
"video-resize-50.mp4";

download.style.display =
"block";

progress.value = 100;

status.textContent =
"✅ Selesai! MP4 siap di-download.";


try{

await ffmpeg.deleteFile(
input
);

await ffmpeg.deleteFile(
"output.mp4"
);

}catch(e){}


}catch(e){

console.error(e);

status.textContent =
"❌ Gagal memproses video.";

errorBox.style.display =
"block";

errorBox.innerHTML =
"<b>Error:</b><br>" +
String(
e.message || e
);

}

resize.disabled = false;

};

</script>

</body>
</html>
