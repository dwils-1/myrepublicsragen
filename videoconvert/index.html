<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Converter Resize 50%</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 7px 0 0;
    color: #d1d5db;
}

.container {
    width: 92%;
    max-width: 650px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.upload-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.upload-box {
    border: 2px dashed #9ca3af;
    border-radius: 14px;
    padding: 35px 20px;
    text-align: center;
    background: #f9fafb;
}

.upload-icon {
    font-size: 45px;
}

.upload-box p {
    color: #6b7280;
}

.file-input {
    width: 100%;
    margin-top: 15px;
}

video {
    width: 100%;
    max-height: 350px;
    margin-top: 20px;
    background: #000;
    border-radius: 12px;
}

.info {
    margin-top: 18px;
    padding: 15px;
    background: #f3f4f6;
    border-radius: 10px;
    line-height: 1.7;
    font-size: 14px;
}

.action-button {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.action-button:hover {
    background: #1d4ed8;
}

.action-button:disabled {
    background: #9ca3af;
}

#downloadButton {
    display: none;
}

progress {
    width: 100%;
    height: 20px;
    margin-top: 20px;
}

#status {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    padding: 20px;
}
</style>
</head>

<body>

<header class="header">

    <h1>🎬 Video Converter Resize 50%</h1>

    <p>
        MP4 / WebM → MP4 • Resolusi turun 50%
    </p>

</header>


<div class="container">

    <div class="upload-title">
        📱 Upload Video HPFA
    </div>


    <div class="upload-box">

        <div class="upload-icon">
            🎥
        </div>

        <strong>
            Pilih Video dari HP
        </strong>

        <p>
            MP4 atau WebM
        </p>

        <input
            class="file-input"
            type="file"
            id="videoInput"
            accept="video/*"
        >

    </div>


    <video
        id="videoPreview"
        controls
        style="display:none;">
    </video>


    <div
        id="videoInfo"
        class="info"
        style="display:none;">
    </div>


    <button
        id="resizeButton"
        class="action-button"
        disabled>

        🔽 Resize Turun 50%

    </button>


    <progress
        id="progressBar"
        value="0"
        max="100"
        style="display:none;">
    </progress>


    <div id="status"></div>


    <a
        id="downloadButton"
        class="action-button"
        href="#"
        download="video-resize-50.mp4">

        ⬇️ Download Video Hasil

    </a>

</div>


<div class="footer">
    Video Converter • Resize 50%
</div>


<!-- FFmpeg -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>

<!-- FFmpeg Utility -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>


<script>

const videoInput =
    document.getElementById("videoInput");

const videoPreview =
    document.getElementById("videoPreview");

const videoInfo =
    document.getElementById("videoInfo");

const resizeButton =
    document.getElementById("resizeButton");

const progressBar =
    document.getElementById("progressBar");

const status =
    document.getElementById("status");

const downloadButton =
    document.getElementById("downloadButton");


let selectedFile = null;

let outputURL = null;

let ffmpeg = null;

let ffmpegLoaded = false;


/* =====================================
   PILIH VIDEO
===================================== */

videoInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) return;


        selectedFile = file;


        const videoURL =
            URL.createObjectURL(file);


        videoPreview.src =
            videoURL;


        videoPreview.style.display =
            "block";


        videoPreview.onloadedmetadata =
            function() {

                const width =
                    videoPreview.videoWidth;

                const height =
                    videoPreview.videoHeight;


                const newWidth =
                    Math.floor(width / 2);

                const newHeight =
                    Math.floor(height / 2);


                videoInfo.style.display =
                    "block";


                videoInfo.innerHTML = `

                    <b>Nama File:</b>
                    ${file.name}

                    <br>

                    <b>Ukuran:</b>
                    ${(file.size / 1024 / 1024).toFixed(2)}
                    MB

                    <br>

                    <b>Resolusi Asli:</b>
                    ${width} × ${height}

                    <br>

                    <b>Resolusi Hasil:</b>
                    ${newWidth} × ${newHeight}

                    <br>

                    <b>Input:</b>
                    ${file.type || "Video"}

                    <br>

                    <b>Output:</b>
                    MP4

                `;

            };


        resizeButton.disabled =
            false;


        downloadButton.style.display =
            "none";


        progressBar.style.display =
            "none";


        status.textContent =
            "";

    }
);


/* =====================================
   LOAD FFMPEG
===================================== */

async function loadFFmpeg() {

    if (ffmpegLoaded) {
        return;
    }


    status.textContent =
        "⏳ Menyiapkan converter...";


    const {
        FFmpeg
    } = FFmpegWASM;


    const {
        toBlobURL
    } = FFmpegUtil;


    ffmpeg =
        new FFmpeg();


    ffmpeg.on(
        "log",
        ({ message }) => {

            console.log(
                "FFmpeg:",
                message
            );

        }
    );


    ffmpeg.on(
        "progress",
        ({ progress }) => {

            if (
                progress >= 0 &&
                progress <= 1
            ) {

                progressBar.value =
                    progress * 100;

                status.textContent =
                    "⏳ Memproses " +
                    Math.round(
                        progress * 100
                    ) +
                    "%";

            }

        }
    );


    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    await ffmpeg.load({

        coreURL:
            await toBlobURL(
                `${baseURL}/ffmpeg-core.js`,
                "text/javascript"
            ),

        wasmURL:
            await toBlobURL(
                `${baseURL}/ffmpeg-core.wasm`,
                "application/wasm"
            )

    });


    ffmpegLoaded =
        true;

}


/* =====================================
   RESIZE
===================================== */

resizeButton.addEventListener(
    "click",
    async function() {

        if (!selectedFile) {
            return;
        }


        resizeButton.disabled =
            true;


        downloadButton.style.display =
            "none";


        progressBar.style.display =
            "block";


        progressBar.value =
            0;


        try {

            /* LOAD FFMPEG */

            await loadFFmpeg();


            status.textContent =
                "⏳ Membaca video...";


            /*
             * Tentukan ekstensi input
             */

            let inputName =
                selectedFile.name
                .toLowerCase();


            let extension =
                inputName
                .split(".")
                .pop();


            if (
                extension !== "mp4" &&
                extension !== "webm" &&
                extension !== "mov" &&
                extension !== "mkv" &&
                extension !== "avi"
            ) {

                extension =
                    "mp4";

            }


            const inputFile =
                `input.${extension}`;


            /*
             * Masukkan file ke FFmpeg
             */

            await ffmpeg.writeFile(
                inputFile,
                await FFmpegUtil.fetchFile(
                    selectedFile
                )
            );


            status.textContent =
                "⏳ Resize video 50%...";


            /*
             * PROSES
             *
             * scale=iw/2:ih/2
             */

            await ffmpeg.exec([

                "-i",
                inputFile,

                "-vf",
                "scale=trunc(iw/2/2)*2:trunc(ih/2/2)*2",

                "-c:v",
                "libx264",

                "-preset",
                "veryfast",

                "-crf",
                "23",

                "-c:a",
                "aac",

                "-b:a",
                "128k",

                "-movflags",
                "+faststart",

                "output.mp4"

            ]);


            /*
             * Ambil output
             */

            const data =
                await ffmpeg.readFile(
                    "output.mp4"
                );


            const result =
                new Uint8Array(data);


            const blob =
                new Blob(
                    [result],
                    {
                        type:
                            "video/mp4"
                    }
                );


            /*
             * DOWNLOAD URL
             */

            if (outputURL) {

                URL.revokeObjectURL(
                    outputURL
                );

            }


            outputURL =
                URL.createObjectURL(
                    blob
                );


            downloadButton.href =
                outputURL;


            downloadButton.download =
                "video-resize-50.mp4";


            downloadButton.style.display =
                "block";


            progressBar.value =
                100;


            status.textContent =
                "✅ Selesai! Video MP4 siap di-download.";


            /*
             * Bersihkan file virtual
             */

            try {

                await ffmpeg.deleteFile(
                    inputFile
                );

                await ffmpeg.deleteFile(
                    "output.mp4"
                );

            } catch(e) {

                console.log(
                    "Cleanup:",
                    e
                );

            }


        } catch(error) {

            console.error(
                "ERROR:",
                error
            );


            status.textContent =
                "❌ Gagal memproses video.";


            alert(
                "Gagal memproses video.\n\n" +
                "Pastikan koneksi internet aktif saat pertama kali menjalankan converter."
            );

        }


        resizeButton.disabled =
            false;

    }
);

</script>

</body>
</html>
