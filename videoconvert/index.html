<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Converter Resize 50%</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #111827;
    }

    .header {
        background: #111827;
        color: white;
        text-align: center;
        padding: 22px 15px;
    }

    .header h1 {
        margin: 0;
        font-size: 25px;
    }

    .header p {
        margin: 7px 0 0;
        color: #d1d5db;
        font-size: 14px;
    }

    .container {
        width: 92%;
        max-width: 650px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    .upload-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .upload-box {
        border: 2px dashed #9ca3af;
        border-radius: 14px;
        padding: 35px 20px;
        text-align: center;
        background: #f9fafb;
    }

    .upload-icon {
        font-size: 45px;
        margin-bottom: 10px;
    }

    .upload-box p {
        margin: 8px 0;
        color: #6b7280;
    }

    .file-input {
        margin-top: 15px;
        width: 100%;
    }

    video {
        width: 100%;
        max-height: 350px;
        margin-top: 20px;
        background: #000;
        border-radius: 12px;
    }

    .info {
        margin-top: 18px;
        padding: 15px;
        background: #f3f4f6;
        border-radius: 10px;
        line-height: 1.7;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
    }

    progress {
        width: 100%;
        height: 20px;
        margin-top: 20px;
    }

    #status {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        font-weight: bold;
    }

    #download {
        display: none;
        width: 100%;
        padding: 15px;
        margin-top: 15px;
        background: #16a34a;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
    }

    .footer {
        text-align: center;
        color: #6b7280;
        font-size: 12px;
        padding: 20px;
    }
</style>
</head>

<body>

<!-- JUDUL -->
<header class="header">
    <h1>🎬 Video Converter Resize 50%</h1>
    <p>Perkecil resolusi video menjadi 50%</p>
</header>


<div class="container">

    <!-- UPLOAD VIDEO HPFA -->
    <div class="upload-title">
        📱 Upload Video HPFA
    </div>

    <div class="upload-box">

        <div class="upload-icon">🎥</div>

        <strong>Pilih Video dari HP</strong>

        <p>
            Video akan diproses langsung di browser
        </p>

        <input
            class="file-input"
            type="file"
            id="videoInput"
            accept="video/*"
        >

    </div>


    <!-- PREVIEW -->
    <video
        id="videoPreview"
        controls
        style="display:none;">
    </video>


    <!-- INFO VIDEO -->
    <div
        id="videoInfo"
        class="info"
        style="display:none;">
    </div>


    <!-- BUTTON -->
    <button
        id="resizeButton"
        disabled>

        🔽 Resize Turun 50%

    </button>


    <!-- PROGRESS -->
    <progress
        id="progressBar"
        value="0"
        max="100"
        style="display:none;">
    </progress>


    <!-- STATUS -->
    <div id="status"></div>


    <!-- DOWNLOAD -->
    <a
        id="downloadButton"
        href="#">

        ⬇️ Download Video Hasil

    </a>

</div>


<div class="footer">
    Video Converter • Resize 50%
</div>


<script>

const videoInput =
    document.getElementById("videoInput");

const videoPreview =
    document.getElementById("videoPreview");

const videoInfo =
    document.getElementById("videoInfo");

const resizeButton =
    document.getElementById("resizeButton");

const progressBar =
    document.getElementById("progressBar");

const status =
    document.getElementById("status");

const downloadButton =
    document.getElementById("downloadButton");


let selectedFile = null;


/* =========================
   PILIH VIDEO
========================= */

videoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    selectedFile = file;

    const videoURL =
        URL.createObjectURL(file);

    videoPreview.src = videoURL;

    videoPreview.style.display = "block";


    videoPreview.onloadedmetadata = function () {

        const originalWidth =
            videoPreview.videoWidth;

        const originalHeight =
            videoPreview.videoHeight;


        const newWidth =
            Math.floor(originalWidth * 0.5);

        const newHeight =
            Math.floor(originalHeight * 0.5);


        videoInfo.style.display = "block";

        videoInfo.innerHTML = `

            <b>Nama File:</b>
            ${file.name}
            <br>

            <b>Ukuran File:</b>
            ${(file.size / 1024 / 1024).toFixed(2)}
            MB

            <br>

            <b>Resolusi Asli:</b>
            ${originalWidth} × ${originalHeight}

            <br>

            <b>Resolusi Hasil:</b>
            ${newWidth} × ${newHeight}

            <br>

            <b>Resize:</b>
            50%

        `;

    };


    resizeButton.disabled = false;

    downloadButton.style.display =
        "none";

    status.textContent = "";

});


/* =========================
   RESIZE VIDEO
========================= */

resizeButton.addEventListener(
    "click",
    async function () {

        if (!selectedFile) return;


        resizeButton.disabled = true;

        progressBar.style.display =
            "block";

        progressBar.value = 0;

        status.textContent =
            "⏳ Sedang memproses video...";


        const video =
            document.createElement("video");

        video.src =
            URL.createObjectURL(selectedFile);

        video.muted = true;


        await new Promise(resolve => {

            video.onloadedmetadata =
                resolve;

        });


        /* RESIZE 50% */

        const width =
            Math.floor(video.videoWidth * 0.5);

        const height =
            Math.floor(video.videoHeight * 0.5);


        /* CANVAS */

        const canvas =
            document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;


        const ctx =
            canvas.getContext("2d");


        /* VIDEO STREAM */

        const stream =
            canvas.captureStream(30);


        /* MEDIA RECORDER */

        let mimeType =
            "video/webm;codecs=vp9";


        if (
            !MediaRecorder.isTypeSupported(
                mimeType
            )
        ) {

            mimeType =
                "video/webm;codecs=vp8";

        }


        if (
            !MediaRecorder.isTypeSupported(
                mimeType
            )
        ) {

            mimeType =
                "video/webm";

        }


        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType: mimeType,
                    videoBitsPerSecond: 2500000
                }
            );


        const chunks = [];


        recorder.ondataavailable =
            function (event) {

                if (event.data.size > 0) {

                    chunks.push(
                        event.data
                    );

                }

            };


        recorder.onstop =
            function () {

                const blob =
                    new Blob(
                        chunks,
                        {
                            type: mimeType
                        }
                    );


                const url =
                    URL.createObjectURL(blob);


                downloadButton.href =
                    url;

                downloadButton.download =
                    "video-resize-50.webm";


                downloadButton.style.display =
                    "block";


                progressBar.value =
                    100;


                status.textContent =
                    "✅ Video selesai diproses!";


                resizeButton.disabled =
                    false;

            };


        /* MULAI */

        recorder.start();

        video.currentTime = 0;

        await video.play();


        function drawFrame() {

            if (
                video.paused ||
                video.ended
            ) {

                recorder.stop();

                return;

            }


            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );


            const percent =
                (
                    video.currentTime /
                    video.duration
                ) * 100;


            progressBar.value =
                percent;


            requestAnimationFrame(
                drawFrame
            );

        }


        drawFrame();

    }
);

</script>

</body>
</html>
