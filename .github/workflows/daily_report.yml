Name: Daily Health Check & Report

on:
  schedule:
    - cron: '27 18 * * *'
  workflow_dispatch:

# Tambahkan ini untuk memaksa penggunaan Node 24 pada Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Ini tetap v4 tidak apa-apa jika sudah ada env di atas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # UBAH DARI '20' MENJADI '24'

      - name: Install Dependencies
        run: npm install axios

      - name: Run Report Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: '2'
          WEB_URL: 'https://myrepublicsragen.my.id/' 
        run: node .github/scripts/send_report.js
