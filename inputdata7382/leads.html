<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>MyRepublic - Leads Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); min-height: 100vh; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; }
        .glass-card { background: rgba(255, 255, 255, 0.98); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); padding: 24px; }
        .input-field { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: all 0.3s; font-weight: 600; font-size: 14px; }
        .input-field:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .force-caps { text-transform: uppercase; }
        label { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #4338ca; margin-bottom: 4px; margin-left: 4px; }
        .btn-submit { background: #4338ca; color: white; width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; box-shadow: 0 10px 15px -3px rgba(67, 56, 202, 0.4); }
        .btn-submit:active { transform: scale(0.95); }
        .lead-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 6px solid #4338ca; border-radius: 16px; padding: 16px; transition: transform 0.2s; }
        .lead-card:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex items-center justify-between mb-6 px-2">
            <div>
                <h1 class="text-white font-black text-xl tracking-tighter">LEADS SYSTEM</h1>
                <p class="text-indigo-200 text-[10px] font-bold uppercase">Manajemen Prospek Pelanggan</p>
            </div>
            <button onclick="window.history.back()" class="bg-white/10 text-white px-4 py-2 rounded-xl text-[10px] font-black border border-white/20">KEMBALI</button>
        </div>

        <div class="glass-card">
            <form id="leadsForm" autocomplete="off" class="space-y-4">
                <input type="hidden" name="action" value="submitLeads">
                <input type="hidden" name="leads_tgl_d2d" id="leads_tgl_d2d_hidden">

                <div>
                    <label>👤 Nama Calon Pelanggan</label>
                    <input type="text" name="leads_nama" placeholder="NAMA LENGKAP" class="input-field force-caps draft-leads" required>
                </div>

                <div>
                    <label>📱 Nomor WhatsApp (WA)</label>
                    <input type="tel" name="leads_hp" placeholder="0812XXXXXX" class="input-field draft-leads" required>
                </div>

                <div>
                    <label>📅 Rencana Janji Temu</label>
                    <input type="date" name="leads_janji_temu" class="input-field draft-leads">
                </div>

                <div>
                    <label>❓ Alasan / Kendala</label>
                    <select name="leads_alasan" class="input-field force-caps draft-leads" required>
                        <option value="">-- PILIH KENDALA --</option>
                        <option value="MASIH TERIKAT KONTRAK PROVIDER LAIN">MASIH TERIKAT KONTRAK PROVIDER LAIN</option>
                        <option value="HARGA DIANGGAP TERLALU MAHAL">HARGA DIANGGAP TERLALU MAHAL</option>
                        <option value="MENUNGGU PERSETUJUAN KELUARGA/PEMILIK">MENUNGGU PERSETUJUAN KELUARGA/PEMILIK</option>
                        <option value="SUDAH NYAMAN DENGAN PROVIDER LAMA">SUDAH NYAMAN DENGAN PROVIDER LAMA</option>
                        <option value="JARINGAN BELUM MASUK (BLANK SPOT)">JARINGAN BELUM MASUK (BLANK SPOT)</option>
                        <option value="ALASAN EKONOMI / BUDGET">ALASAN EKONOMI / BUDGET</option>
                        <option value="HANYA TANYA-TANYA (PRICE LIST)">HANYA TANYA-TANYA (PRICE LIST)</option>
                        <option value="LAIN-LAIN / KENDALA TEKNIS">LAIN-LAIN / KENDALA TEKNIS</option>
                    </select>
                </div>

                <div>
                    <label>📍 Alamat Lengkap & Koordinat</label>
                    <div class="relative mb-2">
                        <input type="text" name="leads_koordinat" id="inputKoordinat" placeholder="TITIK KOORDINAT GPS" class="input-field draft-leads pr-20">
                        <button type="button" onclick="getGeoLocation()" class="absolute right-2 top-2 bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[9px] font-black uppercase">📍 AMBIL</button>
                    </div>
                    <textarea name="leads_alamat" placeholder="ALAMAT LENGKAP" rows="3" class="input-field force-caps draft-leads" required></textarea>
                </div>

                <div class="pt-4 space-y-3">
                    <button type="submit" id="btnKirimLeads" class="btn-submit">Simpan Prospek</button>
                    <button type="button" onclick="lihatDaftarLeads()" class="w-full bg-slate-100 text-slate-600 py-3 rounded-xl font-black text-[10px] uppercase border-2 border-slate-200">📋 LIHAT SEMUA DAFTAR LEADS</button>
                </div>
            </form>

            <div id="leadsList" class="hidden mt-8 space-y-4 pt-6 border-t-2 border-dashed border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-indigo-900 font-black text-sm uppercase">Daftar Prospek</h2>
                    <button onclick="tutupDaftar()" class="text-red-500 font-bold text-[10px] uppercase">Tutup</button>
                </div>
                <div id="cardsContainer" class="space-y-4"></div>
            </div>
        </div>
        <p class="text-center text-indigo-300 text-[10px] mt-6 font-bold uppercase tracking-widest opacity-50">© 2026 MyRepublic Sales System</p>
    </div>

    <script>
        /* GANTI URL DI BAWAH INI DENGAN URL WEB APP BARU HASIL DEPLOYMENT 'SIAPA SAJA' */
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwLdNTyp7ezmoD24uezz6Jojoy4CyS5Igc0WmxhBghJVYKYFFu5ay_I4FUGXZUemVWbYA/exec';

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('leads_tgl_d2d_hidden').value = today;
            loadLeadsDraft();
        });

        function getGeoLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('inputKoordinat').value = lat + ", " + lon;
                    await reverseGeocode(lat, lon);
                    saveLeadsDraft();
                }, () => { alert("Gagal mengambil lokasi. Pastikan GPS aktif."); });
            }
        }

        async function reverseGeocode(lat, lon) {
            const alamatField = document.getElementsByName('leads_alamat')[0];
            alamatField.placeholder = "⏳ Mengekstrak alamat...";
            try {
                const response = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon);
                const data = await response.json();
                if (data && data.display_name) { alamatField.value = data.display_name.toUpperCase(); }
            } catch (err) { console.error("Geocoding Error"); }
        }

        function saveLeadsDraft() {
            const elements = document.querySelectorAll('.draft-leads');
            let draft = {};
            elements.forEach(el => { draft[el.name] = el.value; });
            localStorage.setItem('leadsDraft', JSON.stringify(draft));
        }

        function loadLeadsDraft() {
            const saved = localStorage.getItem('leadsDraft');
            if (saved) {
                const data = JSON.parse(saved);
                const elements = document.querySelectorAll('.draft-leads');
                elements.forEach(el => { if (data[el.name]) el.value = data[el.name]; });
            }
        }

        document.querySelectorAll('.draft-leads').forEach(el => {
            el.addEventListener('input', saveLeadsDraft);
            el.addEventListener('change', saveLeadsDraft);
        });

        document.getElementById('leadsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnKirimLeads');
            btn.disabled = true;
            btn.innerText = "🚀 MENGIRIM...";
            const formData = new FormData(e.target);
            let rawHp = formData.get('leads_hp').replace(/\D/g, "");
            if (rawHp.startsWith("0")) rawHp = "62" + rawHp.slice(1);
            else if (rawHp.startsWith("8")) rawHp = "62" + rawHp;
            formData.set('leads_hp', rawHp);

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.text();
                if (result === "Success") {
                    alert("Berhasil! Data Prospek telah tersimpan.");
                    localStorage.removeItem('leadsDraft');
                    e.target.reset();
                    document.getElementById('leads_tgl_d2d_hidden').value = new Date().toISOString().split('T')[0];
                } else { alert("Gagal menyimpan: " + result); }
            } catch (err) { alert("Kesalahan koneksi."); }
            finally { btn.disabled = false; btn.innerText = "Simpan Prospek"; }
        });

        async function lihatDaftarLeads() {
            const container = document.getElementById('leadsList');
            const cardsContainer = document.getElementById('cardsContainer');
            container.classList.remove('hidden');
            cardsContainer.innerHTML = '<p class="text-center text-[10px] font-bold text-slate-400 animate-pulse">MEMUAT DATA...</p>';
            container.scrollIntoView({ behavior: 'smooth' });
            try {
                const response = await fetch(scriptURL + "?action=getLeads");
                const data = await response.json();
                if (!data || data.length === 0) { cardsContainer.innerHTML = '<p class="text-center text-[10px] font-bold text-slate-400">TIDAK ADA DATA.</p>'; return; }
                renderCards(data);
            } catch (err) { cardsContainer.innerHTML = '<p class="text-center text-[10px] font-bold text-red-400">GAGAL MEMUAT DATA.</p>'; }
        }

        function renderCards(data) {
            const cardsContainer = document.getElementById('cardsContainer');
            cardsContainer.innerHTML = ''; 
            data.forEach(item => {
                const namaPelanggan = item.nama || 'Bapak/Ibu';
                const pesanWA = encodeURIComponent("Halo " + namaPelanggan + ",\n\nSaya dari MyRepublic ingin menindaklanjuti rencana pemasangan internet di lokasi Anda. Apakah ada yang bisa kami bantu?\n\nTerima kasih!");
                const linkWA = "https://wa.me/" + item.hp + "?text=" + pesanWA;
                const linkMaps = item.koordinat ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.koordinat) : "#";

                const card = document.createElement('div');
                card.className = 'lead-card mb-4';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-black text-indigo-900 text-sm uppercase">${item.nama || '-'}</h3>
                        <span class="bg-indigo-100 text-indigo-600 text-[8px] font-black px-2 py-1 rounded-full uppercase">${item.tgl_d2d || 'BARU'}</span>
                    </div>
                    <div class="space-y-1 mb-3">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">📞 ${item.hp || '-'}</p>
                        <p class="text-[10px] text-slate-500 font-bold uppercase">📍 ${item.alamat ? item.alamat.substring(0, 80) : '-'}...</p>
                        <p class="text-[10px] text-orange-600 font-black uppercase">⚠️ ${item.alasan || '-'}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.open('${linkWA}')" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-[9px] font-black py-2.5 rounded-lg uppercase flex items-center justify-center gap-1">💬 Follow Up</button>
                        <button onclick="window.open('${linkMaps}')" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-[9px] font-black py-2.5 rounded-lg uppercase">📍 Lokasi</button>
                    </div>`;
                cardsContainer.appendChild(card);
            });
        }

        function tutupDaftar() { document.getElementById('leadsList').classList.add('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
