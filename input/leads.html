<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyRepublic - Data Leads (Unified)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%); min-height: 100vh; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.98); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); padding: 20px; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 600; font-size: 13px; margin-bottom: 10px; }
        .input-field:focus { border-color: #6366f1; outline: none; }
        .btn-primary { width: 100%; background: #4338ca; color: white; padding: 15px; border-radius: 12px; font-weight: 900; text-transform: uppercase; font-size: 12px; box-shadow: 0 4px 15px rgba(67, 56, 202, 0.4); }
        .btn-back { background: #cbd5e1; color: #334155; margin-bottom: 20px; }
        .force-caps { text-transform: uppercase; }
        .lead-card { border-left: 8px solid #1e293b; background: #f8fafc; border-radius: 16px; padding: 15px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <button onclick="window.location.href='index.html'" class="w-full bg-white text-slate-800 font-black py-3 rounded-xl uppercase text-xs mb-6 shadow-lg active:scale-95 transition-all">
        ⬅️ KEMBALI KE MENU UTAMA
    </button>

    <div class="glass-card">
        <h1 class="text-2xl font-black text-indigo-900 uppercase text-center mb-6 tracking-tight">Kelola Data Leads</h1>
        
        <div class="flex gap-2 mb-6">
            <button onclick="showSection('input')" id="btnTabInput" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold text-xs shadow-md transition-all">INPUT BARU</button>
            <button onclick="showSection('cari')" id="btnTabCari" class="flex-1 bg-slate-200 text-slate-600 py-2 rounded-lg font-bold text-xs transition-all">CARI DATA</button>
        </div>

        <div id="sectionInput">
            <form id="leadsForm" autocomplete="off">
                <input type="hidden" name="leads_tgl_d2d" id="leads_tgl_d2d">
                
                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Nama Customer</label>
                <input type="text" name="leads_nama" placeholder="MASUKKAN NAMA" class="input-field force-caps" required>

                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Nomor WhatsApp</label>
                <input type="tel" name="leads_wa" placeholder="08XXXXXXXXXX" class="input-field" required>

                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Tanggal Janji</label>
                <input type="date" name="leads_tgl_janji" class="input-field" required>

                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Titik Koordinat</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" name="leads_koordinat" id="leads_koordinat" placeholder="Mencari titik..." class="input-field mb-0 bg-slate-50" readonly>
                    <button type="button" onclick="getLocation()" class="bg-indigo-100 text-indigo-700 px-4 rounded-xl font-black text-[10px] border border-indigo-200 active:scale-90 transition-all uppercase">📍 Ambil Lokasi</button>
                </div>

                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Alamat Lengkap</label>
                <textarea name="leads_alamat" id="leads_alamat" placeholder="ALAMAT OTOMATIS/MANUAL" rows="3" class="input-field force-caps" required></textarea>

                <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Alasan / Keterangan</label>
                <select name="leads_alasan" class="input-field" required>
                    <option value="">-- PILIH ALASAN --</option>
                    <option value="MASIH BERLANGGANAN LAIN">MASIH BERLANGGANAN LAIN</option>
                    <option value="MENUNGGU GAJIAN">MENUNGGU GAJIAN</option>
                    <option value="HARGA BELUM COCOK">HARGA BELUM COCOK</option>
                    <option value="PIKIR-PIKIR">PIKIR-PIKIR</option>
                    <option value="LAINNYA">LAINNYA</option>
                </select>

                <button type="submit" id="btnKirimLeads" class="btn-primary mt-4 active:scale-95 transition-all">SIMPAN DATA LEADS</button>
            </form>
        </div>

        <div id="sectionCari" class="hidden">
            <label class="text-[10px] font-black uppercase text-slate-500 ml-1">Pencarian Cepat</label>
            <input type="text" id="searchLeadsInput" placeholder="Cari Nama atau Alamat..." class="input-field mb-4" oninput="filterLeads()">
            
            <button onclick="loadLeadsData(this)" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl text-xs mb-6 shadow-lg active:scale-95 transition-all uppercase tracking-widest">
                🔄 Sinkronisasi Sheet DataLeads
            </button>

            <div id="leadsListContainer" class="flex flex-col gap-3 pb-10">
                <p class="text-center text-xs text-slate-400 italic">Klik sinkronisasi untuk memuat data terbaru...</p>
            </div>
        </div>
    </div>

<script>
    /**
     * KONFIGURASI BACKEND
     * Pastikan URL Web App Anda sudah di-deploy sebagai 'Anyone'
     */
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwwVKwzgGL_qf5Ee6GpErQKcinaIDl6oKu91yjjW8sAwgjnuUps9gCeJ4LJZKZBRefI/exec'; 

    let fullLeadsData = JSON.parse(localStorage.getItem('fullLeadsData')) || [];

    // INISIALISASI HALAMAN
    window.onload = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        
        // Auto-set Tanggal Input (leads_tgl_d2d)
        const dateEl = document.getElementById('leads_tgl_d2d');
        if(dateEl) dateEl.value = `${y}-${m}-${d}`;
        
        // Load data dari memori lokal (jika ada)
        if(fullLeadsData.length > 0) renderLeadsList(fullLeadsData);
    };

    // NAVIGASI TAB
    function showSection(sec) {
        const inputSec = document.getElementById('sectionInput');
        const cariSec = document.getElementById('sectionCari');
        const tabInput = document.getElementById('btnTabInput');
        const tabCari = document.getElementById('btnTabCari');

        inputSec.classList.add('hidden');
        cariSec.classList.add('hidden');
        tabInput.className = "flex-1 bg-slate-200 text-slate-600 py-2 rounded-lg font-bold text-xs transition-all";
        tabCari.className = "flex-1 bg-slate-200 text-slate-600 py-2 rounded-lg font-bold text-xs transition-all";

        if(sec === 'input') {
            inputSec.classList.remove('hidden');
            tabInput.className = "flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold text-xs shadow-md transition-all";
        } else {
            cariSec.classList.remove('hidden');
            tabCari.className = "flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold text-xs shadow-md transition-all";
        }
    }

    // --- FITUR GEOLOCATION (PERBAIKAN) ---
    function getLocation() {
        const coordInput = document.getElementById('leads_koordinat');
        const alamatInput = document.getElementById('leads_alamat');
        
        if (!navigator.geolocation) {
            alert("Maaf, Browser Anda tidak mendukung fitur lokasi (GPS).");
            return;
        }

        coordInput.value = "Sedang melacak...";
        
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const long = position.coords.longitude;
                coordInput.value = `${lat}, ${long}`;
                
                try {
                    alamatInput.placeholder = "Mencoba mengenali alamat...";
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${long}`);
                    const data = await response.json();
                    
                    if(data.address) {
                        const addr = data.address;
                        // Susun alamat dari komponen yang tersedia
                        const detailAlamat = [
                            addr.road, 
                            addr.village || addr.suburb, 
                            addr.city_district || addr.district, 
                            addr.city || addr.regency
                        ].filter(Boolean).join(', ').toUpperCase();
                        
                        alamatInput.value = detailAlamat;
                    }
                } catch(e) { 
                    console.log("Reverse Geocode Error: ", e);
                    alamatInput.placeholder = "Gagal memuat alamat otomatis, isi manual.";
                }
            },
            (error) => {
                let msg = "Gagal mengambil lokasi.";
                if(error.code == 1) msg = "Izin GPS ditolak. Mohon aktifkan izin lokasi di pengaturan browser.";
                else if(error.code == 2) msg = "Sinyal GPS tidak tersedia. Pastikan Anda berada di area terbuka.";
                else if(error.code == 3) msg = "Waktu pelacakan habis. Silakan coba lagi.";
                
                alert(msg);
                coordInput.value = "";
                coordInput.placeholder = "LAT, LONG";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    // --- SIMPAN DATA KE SHEET DATALEADS ---
    document.getElementById('leadsForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btnKirimLeads');
        btn.disabled = true; 
        btn.innerText = "⏳ SEDANG MENGIRIM...";
        
        const formData = new FormData(e.target);
        
        try {
            // Mengirim ke Apps Script dengan parameter action=submitLead
            const response = await fetch(`${scriptURL}?action=submitLead`, { 
                method: 'POST', 
                body: formData 
            });
            const result = await response.text();
            
            if(result === "Success") {
                alert("✅ DATA BERHASIL DISIMPAN KE SHEET 'DataLeads'");
                e.target.reset();
                localStorage.removeItem('fullLeadsData'); // Paksa refresh data nantinya
                window.location.reload(); 
            } else {
                alert("Respon Server: " + result);
            }
        } catch(err) {
            console.error(err);
            alert("Gagal terhubung ke server. Pastikan Deploy Apps Script sudah benar.");
        } finally {
            btn.disabled = false; 
            btn.innerText = "SIMPAN DATA LEADS";
        }
    });

    // --- AMBIL DATA DARI SHEET DATALEADS ---
    async function loadLeadsData(btnEl) {
        btnEl.innerText = "⏳ SINKRONISASI DATA...";
        btnEl.disabled = true;
        
        try {
            // Mengirim request GET dengan parameter action=getLeads
            const response = await fetch(`${scriptURL}?action=getLeads`);
            const json = await response.json();
            
            if(json.status === "success") {
                fullLeadsData = json.data || [];
                localStorage.setItem('fullLeadsData', JSON.stringify(fullLeadsData));
                renderLeadsList(fullLeadsData);
            } else {
                alert("Gagal: " + (json.message || "Data tidak ditemukan"));
            }
        } catch(e) {
            console.error(e);
            alert("Kesalahan koneksi saat mengambil data Leads.");
        } finally {
            btnEl.innerText = "🔄 SINKRONISASI SHEET DATALEADS";
            btnEl.disabled = false;
        }
    }

    // --- TAMPILKAN LIST LEADS KE HTML ---
    function renderLeadsList(data) {
        const container = document.getElementById('leadsListContainer');
        container.innerHTML = "";
        
        if(!data || data.length === 0) { 
            container.innerHTML = "<p class='text-center text-xs text-slate-400'>Tidak ada data ditemukan di Sheet DataLeads.</p>"; 
            return; 
        }
        
        data.forEach(item => {
            // Mengambil key yang sudah di-lowercase oleh backend (Apps Script)
            const nama = item.nama || item.leads_nama || "-";
            const waRaw = item.wa || item.leads_wa || "";
            const alamat = item.alamat || item.leads_alamat || "-";
            const janji = item.tgl_janji || item.leads_tgl_janji || "-";
            const alasan = item.alasan || item.leads_alasan || "-";
            const koordinat = item.koordinat || item.leads_koordinat || "";

            if(nama === "-") return;

            // Format nomor WA untuk link
            const waLink = waRaw.toString().replace(/\D/g,'').replace(/^0/,'62');
            
            // Format Link Google Maps
            const mapsUrl = koordinat ? `https://www.google.com/maps/search/?api=1&query=${koordinat}` : "#";

            const cardHtml = `
            <div class="lead-card shadow-sm">
                <div class="flex justify-between items-start mb-1">
                    <h4 class="font-black text-sm uppercase text-slate-900 leading-tight">${nama}</h4>
                    <span class="text-[9px] font-black text-indigo-700 bg-indigo-50 px-2 py-1 rounded border border-indigo-100 uppercase">
                        Janji: ${janji.toString().substring(0,10)}
                    </span>
                </div>
                <p class="text-[10px] font-bold text-slate-500 mb-2 leading-snug">📍 ${alamat}</p>
                
                <div class="bg-amber-50 p-2 rounded-lg border border-amber-100 text-[10px] font-bold mb-3">
                    <span class="text-amber-800 uppercase italic">Catatan: ${alasan}</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <a href="https://wa.me/${waLink}" target="_blank" class="bg-green-600 text-white text-center py-2.5 rounded-lg font-black text-[10px] shadow-md active:scale-95 transition-all uppercase">
                        WhatsApp
                    </a>
                    <a href="${mapsUrl}" target="_blank" class="${koordinat ? 'bg-blue-600' : 'bg-slate-300 pointer-events-none'} text-white text-center py-2.5 rounded-lg font-black text-[10px] shadow-md active:scale-95 transition-all uppercase">
                        📍 Lokasi
                    </a>
                </div>
            </div>`;
            container.innerHTML += cardHtml;
        });
    }

    // --- FITUR SEARCH REAL-TIME ---
    function filterLeads() {
        const query = document.getElementById('searchLeadsInput').value.toLowerCase();
        const filtered = fullLeadsData.filter(item => {
            const nama = (item.nama || item.leads_nama || "").toLowerCase();
            const alamat = (item.alamat || item.leads_alamat || "").toLowerCase();
            return nama.includes(query) || alamat.includes(query);
        });
        renderLeadsList(filtered);
    }
</script>
</body>
</html>
